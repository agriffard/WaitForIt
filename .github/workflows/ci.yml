name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore /p:TreatWarningsAsErrors=true

      - name: Build
        run: dotnet build WaitForIt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WaitForIt.slnx --configuration Release --no-build
